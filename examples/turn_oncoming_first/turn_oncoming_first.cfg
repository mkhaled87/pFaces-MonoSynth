#-----------------------------------------------------------------------
# ACC (Adaptive Cruise Control) Configuration
#-----------------------------------------------------------------------

project_name = "turn_oncoming_first";
user_dynamics_file = "turn_oncoming_first_dynamics.cl";

# System Parameters
sampling_period = "0.1";      # Discrete time step (seconds)
ode_steps = "5";             # RK4 integration steps (tested safe: exact match at 50M cells)

# Memory Limits
max_basis_elements = "50000";

# State Space: [s_ego, v_ego, s_oncoming]
states{
	dim = "3";
	eta = "0.1,0.1,0.05";    # Grid resolution
	lb  = "-40.0,0.0,-40.0"; # Lower bounds
	ub  = "10.0,10.0,10.0";  # Upper bounds
	err = "0.0,0.0,0.0";
	priorities = "1,1,0";    # 0=max-good, 1=min-good
}

# Control Inputs
inputs{
	dim = "1";
	eta = "50.0";
	lb  = "-1800.0";
	ub  = "1200.0";
}

# Disturbances
disturbances{
	dim = "0";
}

# Output Settings
data = "raw";
save_transitions = "false";
save_controller = "true";
implement = "no";
record_basis_evolution = "true";
use_threshold_table = "true";
use_tt_only = "true";
use_inline_dynamics = "false";

# Legacy validator parameters (unused by mono_synth)
post{ useode = "false"; codeonly = "true"; xx1 = "0"; xx2 = "0"; xx3 = "0"; }
growth{ useode = "false"; codeonly = "true"; maxposts = "64"; rr1 = "0"; rr2 = "0"; rr3 = "0"; }
