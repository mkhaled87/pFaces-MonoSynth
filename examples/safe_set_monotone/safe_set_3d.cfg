# Configuration for 3D safe set computation using monotone synthesis
project_name = "safe_set_3d";
data = "raw";
save_transitions = "false";
save_controller = "true";

samplingperiod = "0.4";

states{
    dim = "3";
    eta = "0.8,0.4,0.4";
    lb  = "0.0,0.0,0.0";
    ub  = "80.0,20.0,20.0";
    err = "0.0,0.0,0.0";
}

inputs{
    dim = "1";
    eta = "150.0";
    lb  = "-1800.0";
    ub  = "1200.0";
    err = "0.0";
}

# Post dynamics using ODE (derivatives)
# Based on safe_Set.cpp 3D dynamics with embedded parameters
post{
    useode = "true";
    # States: x1=relative_distance, x2=ego_velocity, x3=lead_velocity
    # Input: u1=ego_torque
    
    # Relative distance derivative: ds = vL - vE
    xx1 = "x3 - x2";
    
    # Ego acceleration (worst-case parameters embedded)
    # Using conservative fixed parameters to match safe_Set.cpp dynamics
    # dvE = select(a_ego, 0.0, x2 > 0.0 || a_ego > 0.0) where a_ego = a + b*x2 + c*x2*x2
    xx2 = "select((1.0/2000.0)*(u1/0.35 - 300.0) - (1.0/2500.0)*0.10*x2 - (1.0/2500.0)*0.30*x2*x2, 0.0, x2 > 0.0)";
    
    # Lead acceleration (worst-case: lead at max speed, no acceleration)
    # dvL = select(a_lead, 0.0, x3 < 20.0 && a_lead > 0.0) to clamp at V_MAX_3D=20
    xx3 = "select((1.0/2000.0)*(1200.0/0.30 - 350.0) - (1.0/2000.0)*0.25*x3 - (1.0/2000.0)*0.65*x3*x3, 0.0, x3 < 20.0)";
}

# Growth dynamics
growth{
    useode = "false";
    maxposts = "32";
    rr1 = "r1";
    rr2 = "r2";
    rr3 = "r3";
}

safe{
    count = "1";
    s1{type="rectangle"; h="{0.0,80.0},{0.0,20.0},{0.0,20.0}";}
}

# Note: This config uses worst-case parameters embedded in the ODE
# R_W_MIN = 0.30, R_W_MAX = 0.35
# M_MIN = 2000.0, M_MAX = 2500.0
# ALPHA_MIN = 300.0, ALPHA_MAX = 350.0
# BETA_MIN = 0.10, BETA_MAX = 0.25
# GAMMA_MIN = 0.30, GAMMA_MAX = 0.65

