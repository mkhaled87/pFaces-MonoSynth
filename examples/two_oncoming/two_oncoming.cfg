#-----------------------------------------------------------------------
# Two Oncoming Vehicles — 4D Unified Grid Configuration
#
# Defines the state domain for the MPPI controller:
#   (s_ego, v_ego, s_onc1, s_onc2)
#
# Safety is evaluated via dual-proxy mode, which queries two separate
# 3D sub-SafeSets (turn_ego_first and turn_oncoming_first) and takes
# the conjunction.  No 4D bitmap is allocated.
#
# NOT used for pFaces synthesis — the two sub-syntheses use their own
# cfgs.  This cfg provides MPPI state bounds and grid resolution.
#-----------------------------------------------------------------------

project_name = "two_oncoming";
user_dynamics_file = "two_oncoming_dynamics.cl";

# System Parameters
sampling_period = "0.1";
ode_steps = "200";

# Memory Limits
max_basis_elements = "50000";

# State Space: [s_ego, v_ego, s_onc1, s_onc2]
# s_onc1 = position of Vehicle 1 (closer, ego waits for it)
# s_onc2 = position of Vehicle 2 (farther, ego crosses before it)
# NOTE: This 4D grid is the MPPI controller domain.  No 4D bitmap is
# allocated — the dual-proxy SafeSet delegates to two 3D sub-bitmaps.
states{
	dim = "4";
	eta = "0.2,0.1,0.1,0.1";
	lb  = "-50.0,0.0,-50.0,-50.0";
	ub  = "10.0,12.0,10.0,10.0";
	err = "0.0,0.0,0.0,0.0";
	priorities = "0,0,1,1";
}

# Control Inputs
inputs{
	dim = "1";
	eta = "50.0";
	lb  = "-1800.0";
	ub  = "1200.0";
}

# Disturbances
disturbances{
	dim = "0";
}

# Output Settings
data = "raw";
boundary_semantics = "favorable_saturating";
save_transitions = "false";
save_controller = "false";
implement = "no";
record_basis_evolution = "false";
synthesis_method = "threshold";
transition_semantics = "extremal_single_successor";
transition_backend = "precomputed";
threshold_d_star = "-1";

# Legacy validator parameters (unused by mono_synth)
post{ useode = "false"; codeonly = "true"; xx1 = "0"; xx2 = "0"; xx3 = "0"; }
growth{ useode = "false"; codeonly = "true"; maxposts = "64"; rr1 = "0"; rr2 = "0"; rr3 = "0"; }
