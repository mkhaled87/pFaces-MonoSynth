#-----------------------------------------------------------------------
# ACC (Adaptive Cruise Control) Configuration
#-----------------------------------------------------------------------

project_name = "acc";
user_dynamics_file = "acc_dynamics.cl";

# System Parameters
samplingperiod = "0.4";      # Discrete time step (seconds)
ode_steps = "200";           # RK4 integration steps

# Memory Limits
max_basis_elements = "2000";  # Adjust based on expected safe-set size

# State Space: [headway, ego_velocity, lead_velocity]
states{
	dim = "3";
	eta = "0.8,0.4,0.4";     # Grid resolution
	lb  = "0.0,0.0,0.0";     # Lower bounds
	ub  = "80.0,20.0,20.0";  # Upper bounds
	err = "0.0,0.0,0.0";
	priorities = "0,1,0";    # 0=max-priority, 1=min-priority
}

# Control Inputs: [ego_braking]
inputs{
	dim = "1";
	eta = "0.3";
	lb  = "-1.0";
	ub  = "1.0";
	err = "0.0";
}

# Disturbances: [lead_braking]
disturbances{
	dim = "1";
}

# Output Settings
data = "raw";
save_transitions = "false";
save_controller = "true";
implement = "no";

# Legacy validator parameters (unused by mono_synth)
post{ useode = "false"; codeonly = "true"; xx1 = "0"; xx2 = "0"; xx3 = "0"; }
growth{ useode = "false"; codeonly = "true"; maxposts = "64"; rr1 = "0"; rr2 = "0"; rr3 = "0"; }